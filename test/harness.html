<!doctype html>
<meta charset="utf-8">
<title>側欄測試(假資料)</title>
<link rel="stylesheet" href="../extension/panel.css">
<iframe id="page" style="display:none"></iframe>
<header><h1>藥看仔細 <span>SeeUrMeds</span></h1><button id="reload" type="button">重新讀取</button></header>
<p id="status"></p><main id="list"></main>
<footer><span id="built"></span> 測試頁:用假的 chrome API 讀 fixture。</footer>
<script src="../extension/core.js"></script>
<script>
// 假的 chrome API:從 iframe 裡的假雲端藥歷頁讀表格
const fixture = new URLSearchParams(location.search).get('f') || 'fixture_one_table.html';
const frame = document.getElementById('page');
const ready = new Promise((ok) => { frame.onload = ok; frame.style.cssText = 'position:absolute;left:-9999px;width:1200px;height:800px'; frame.src = fixture; });
window.chrome = {
  runtime: { getURL: (p) => '../extension/' + p, onMessage: { addListener() {} } },
  tabs: {
    query: async () => [{ id: 1 }], onActivated: { addListener() {} },
    sendMessage: async () => { await ready; const meds = SeeUrMeds.readMeds(frame.contentDocument); window.__meds = meds; return meds ? { meds } : undefined; },
  },
};
</script>
<script src="../extension/panel.js"></script>
